name: Verify and publish 火市 技術課

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Pre-release tag for this site. Leave empty to verify the candidate only.'
        required: false
        type: string
      recommendation_id:
        description: 'Approved recommendation receipt. Used by the recommendation queue.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hinome-tech-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'TaurusGGBOY/hinome-tech' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, hinome-tech-cloud]
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      SITE_SHA: ${{ github.sha }}
      RECOMMENDATION_ID: ${{ inputs.recommendation_id }}
      RECOMMENDATION_API: https://hinome-tech-recommendations.gaoguobin12.workers.dev
      PUBLIC_URL: https://hinome-tech.pages.dev/
      CHROME_PATH: /opt/hinome-ci-tools/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use preinstalled CI tools
        run: echo "/opt/hinome-ci-tools/bin" >> "$GITHUB_PATH"

      - name: Prepare the approved catalog contribution
        id: recommendation
        if: inputs.recommendation_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RECOMMENDATION_TOKEN: ${{ secrets.RECOMMENDATION_PUBLISH_TOKEN }}
        run: |
          [[ -z "$RELEASE_TAG" ]]
          bash scripts/prepare-recommendation.sh

      - name: Verify candidate in the browser
        if: steps.recommendation.outputs.skip != 'true'
        run: |
          npm ci
          npm run test:recommend
          node scripts/browser-smoke.cjs

      - name: Verify the release tag contains the same site
        if: env.RELEASE_TAG != '' && steps.recommendation.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags origin main
          tagged_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          git diff --exit-code "$tagged_commit" "$SITE_SHA" -- public/
          git diff --exit-code "$SITE_SHA" FETCH_HEAD -- public/
          jq -e --arg version "$RELEASE_TAG" '.[0] | .version == $version and
            (.title | type == "string" and length > 0) and
            ([.changes[]?, .resources[]?] | length > 0)' public/releases.json >/dev/null
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease |
            jq -e '.isPrerelease and (.isDraft | not)' >/dev/null

      - name: Deploy to Cloudflare Pages
        if: env.RELEASE_TAG != '' && steps.recommendation.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if (echo >/dev/tcp/127.0.0.1/7890) 2>/dev/null; then
            export HTTPS_PROXY=http://127.0.0.1:7890 HTTP_PROXY=http://127.0.0.1:7890 CHROME_PROXY=http://127.0.0.1:7890
          fi
          npx --yes wrangler@4.152.0 pages deploy public \
            --project-name hinome-tech --branch main --commit-hash "$SITE_SHA"

      - name: Verify the published site
        if: env.RELEASE_TAG != '' && steps.recommendation.outputs.skip != 'true'
        shell: bash
        run: |
          if (echo >/dev/tcp/127.0.0.1/7890) 2>/dev/null; then
            export HTTPS_PROXY=http://127.0.0.1:7890 HTTP_PROXY=http://127.0.0.1:7890 CHROME_PROXY=http://127.0.0.1:7890
          fi
          while IFS= read -r -d '' file; do
            relative_path="${file#public/}"
            if [[ "$relative_path" == index.html ]]; then
              relative_path=""
            fi
            for attempt in 1 2 3 4 5 6; do
              if curl --compressed --retry 1 --connect-timeout 6 --max-time 12 \
                -H 'Cache-Control: no-cache' -fsSL "$PUBLIC_URL$relative_path" | cmp -s "$file" -; then
                break
              fi
              if [[ "$attempt" == 6 ]]; then
                echo "::error::Could not match the public response to $file."
                exit 1
              fi
              sleep 5
            done
          done < <(find public -type f -print0)
          node scripts/browser-smoke.cjs "$PUBLIC_URL"

      - name: Mark the verified release as stable
        if: env.RELEASE_TAG != '' && steps.recommendation.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --prerelease=false --latest

      - name: Confirm the recommendation is live
        if: inputs.recommendation_id != ''
        env:
          RECOMMENDATION_TOKEN: ${{ secrets.RECOMMENDATION_PUBLISH_TOKEN }}
        run: |
          curl --silent --show-error --fail --max-time 30 --retry 2 -X POST \
            -H "Authorization: Bearer $RECOMMENDATION_TOKEN" \
            "$RECOMMENDATION_API/internal/publication/$RECOMMENDATION_ID" >/dev/null

      - name: Clean workspace dependencies and expired caches
        if: always()
        continue-on-error: true
        run: |
          rm -rf node_modules
          rm -rf "${HOME}/.config/google-chrome/Default/Cache" "${HOME}/.cache/google-chrome" 2>/dev/null || true
          for d in "${HOME}/.npm/_cacache" "${HOME}/.npm/_npx"; do
            [ -d "$d" ] && find "$d" -type f -mtime +7 -delete || true
          done
          [ -d "${HOME}/.npm" ] && find "${HOME}/.npm" -type d -empty -delete 2>/dev/null || true
