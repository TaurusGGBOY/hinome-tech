name: Verify and publish 火市 技術課

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Pre-release tag for this site. Leave empty to verify the candidate only.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hinome-tech-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'TaurusGGBOY/hinome-tech' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, hinome-tech-cloud]
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      PUBLIC_URL: https://hinome-tech.pages.dev/
      CHROME_PATH: /opt/hinome-ci-tools/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js from the Aliyun runner
        run: echo "/opt/hinome-ci-tools/bin" >> "$GITHUB_PATH"

      - name: Verify candidate in the browser
        run: |
          npm ci
          node scripts/browser-smoke.cjs

      - name: Verify the release tag contains the same site
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tagged_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          git diff --exit-code "$tagged_commit" "$GITHUB_SHA" -- public/
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease |
            jq -e '.isPrerelease and (.isDraft | not)' >/dev/null

      - name: Deploy to Cloudflare Pages
        if: inputs.release_tag != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if (echo >/dev/tcp/127.0.0.1/7890) 2>/dev/null; then
            export HTTPS_PROXY=http://127.0.0.1:7890 HTTP_PROXY=http://127.0.0.1:7890 CHROME_PROXY=http://127.0.0.1:7890
          fi
          npx --yes wrangler@4.152.0 pages deploy public \
            --project-name hinome-tech --branch main --commit-hash "$GITHUB_SHA"

      - name: Verify the published site
        if: inputs.release_tag != ''
        shell: bash
        run: |
          if (echo >/dev/tcp/127.0.0.1/7890) 2>/dev/null; then
            export HTTPS_PROXY=http://127.0.0.1:7890 HTTP_PROXY=http://127.0.0.1:7890 CHROME_PROXY=http://127.0.0.1:7890
          fi
          while IFS= read -r -d '' file; do
            relative_path="${file#public/}"
            if [[ "$relative_path" == index.html ]]; then
              relative_path=""
            fi
            if ! curl --compressed --retry 2 --connect-timeout 10 --max-time 30 -fsSL "$PUBLIC_URL$relative_path" | cmp -s "$file" -; then
              echo "::error::Could not match the public response to $file."
              exit 1
            fi
          done < <(find public -type f -print0)
          node scripts/browser-smoke.cjs "$PUBLIC_URL"

      - name: Mark the verified release as stable
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --prerelease=false --latest

      - name: Clean workspace dependencies and expired caches
        if: always()
        continue-on-error: true
        run: |
          rm -rf node_modules
          rm -rf "${HOME}/.config/google-chrome/Default/Cache" "${HOME}/.cache/google-chrome" 2>/dev/null || true
          for d in "${HOME}/.npm/_cacache" "${HOME}/.npm/_npx"; do
            [ -d "$d" ] && find "$d" -type f -mtime +7 -delete || true
          done
          [ -d "${HOME}/.npm" ] && find "${HOME}/.npm" -type d -empty -delete 2>/dev/null || true
