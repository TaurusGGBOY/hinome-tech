<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#283d53" />
    <meta name="description" content="火羽相关实用工具、百科资料、影像档案、亲历回顾与二创作品导航。" />
    <title>火市 技術課 · 火市・技术科</title>
    <link rel="icon" href="assets/site.png" />
    <link rel="stylesheet" href="style.css" />
    <script src="resources.js" defer></script>
    <script src="catalog.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#catalog">跳至资源目录</a>
    <div class="page">
      <header class="header">
        <div class="brand">
          <img
            class="site-icon"
            src="assets/site.png"
            alt=""
            width="42"
            height="42"
          />
          <div>
            <h1 lang="ja">火市 技術課</h1>
            <p>火市・技术科</p>
          </div>
        </div>
        <p class="intro">火羽相关资源导航 · <a href="about.html">关于本站</a></p>
        <label class="sr-only" for="search">搜索资源</label>
        <div class="search">
          <span class="search-mark" aria-hidden="true"></span
          ><input
            id="search"
            type="search"
            placeholder="搜索名称、简介或标签"
            autocomplete="off"
          /><kbd>⌘ / Ctrl K</kbd
          ><button id="clear" type="button" aria-label="清除搜索" hidden>

          </button>
        </div>
      </header>
      <main id="catalog" tabindex="-1">
        <p id="status" class="sr-only" role="status" aria-live="polite"></p>
        <div id="groups"></div>
        <section class="empty" id="empty" hidden>
          <h2>没有找到相关资源</h2>
          <p>试试其他名称或标签。</p>
          <button id="empty-clear" type="button">清除搜索</button>
        </section>
      </main>
      <footer>非官方粉丝导航 · <a href="about.html">关于本站</a></footer>
